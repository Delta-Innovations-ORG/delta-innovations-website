<svg xmlns="http://www.w3.org/2000/svg" width="920" height="140" viewBox="0 0 920 140" role="img" aria-label="Delta Innovations Documentation">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="920" height="140" rx="12" fill="url(#bg)"/>
  <circle cx="72" cy="70" r="36" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 8" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="0 72 70" to="360 72 70" dur="12s" repeatCount="indefinite"/>
  </circle>
  <path d="M72 42 L96 88 L48 88 Z" fill="rgba(34,211,238,0.15)" stroke="url(#accent)" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)"/>
  <text x="130" y="58" fill="#F8FAFC" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700">Delta Innovations</text>
  <text x="130" y="88" fill="#94A3B8" font-family="system-ui,Segoe UI,sans-serif" font-size="15">Documentation · Engineering with clarity, security, and scale</text>
  <rect x="130" y="102" width="280" height="4" rx="2" fill="url(#accent)" opacity="0.9"/>
</svg>
